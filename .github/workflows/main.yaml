on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
      - run: npm ci
      - run: npx gts lint
      - run: node src/main.ts
